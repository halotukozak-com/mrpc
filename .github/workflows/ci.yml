name: Run CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1

      - name: Cache scala-cli/Bloop incremental build
        uses: actions/cache@v6
        with:
          path: .scala-build
          key: scala-build-jvm-${{ hashFiles('project.scala', '**/*.scala') }}
          restore-keys: |
            scala-build-jvm-

      - uses: VirtusLab/scala-cli-setup@v1

      - name: Check formatting
        run: scala-cli --power fmt --check .

      - name: Run tests
        run: scala-cli --power test .

  compile:
    name: Compile (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            args: ""
          - platform: scala-js
            args: "--js-version 1.22.0"
          - platform: scala-native
            args: "--native-version 0.5.12"
    steps:
      - uses: actions/checkout@v7
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - name: Cache scala-cli/Bloop incremental build
        uses: actions/cache@v6
        with:
          path: .scala-build
          key: scala-build-${{ matrix.platform }}-${{ hashFiles('project.scala', '**/*.scala') }}
          restore-keys: |
            scala-build-${{ matrix.platform }}-
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Compile
        run: scala-cli --power compile . --platform ${{ matrix.platform }} ${{ matrix.args }}

  # JVM is covered by the `build` job above; this just runs the same suite on
  # the other targets to catch platform-specific regressions.
  test-cross-platform:
    name: Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: scala-js
            args: "--js-version 1.22.0"
          - platform: scala-native
            args: "--native-version 0.5.12"
    steps:
      - uses: actions/checkout@v7
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - name: Cache scala-cli/Bloop incremental build
        uses: actions/cache@v6
        with:
          path: .scala-build
          key: scala-build-${{ matrix.platform }}-${{ hashFiles('project.scala', '**/*.scala') }}
          restore-keys: |
            scala-build-${{ matrix.platform }}-
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run tests
        run: scala-cli --power test . --platform ${{ matrix.platform }} ${{ matrix.args }}
