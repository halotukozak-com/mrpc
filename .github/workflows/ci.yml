name: Run CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# mcodec's fix for made 0.3.0 compat isn't released yet, so it's still built from
# a pinned commit and published locally. made itself is resolved straight from
# Maven Central (see project.scala) now that v0.3.0 is out -- but the pinned
# mcodec commit's own project.scala still declares the older made:0.1.3, so it
# gets repointed to made:0.3.0 below before publishing.
env:
  MADE_VERSION: 0.3.0
  MCODEC_VERSION: 0.0.0-done-SNAPSHOT

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mrpc
        uses: actions/checkout@v6
        with:
          path: mrpc

      # Pinned until halotukozak/mcodec#4 merges and a release with the fix ships.
      - name: Checkout mcodec
        uses: actions/checkout@v6
        with:
          repository: halotukozak/mcodec
          ref: 95c51f5556531760c3f0f422170aaf9e6a3c2aae # fix-made-0.3.0-compat, until halotukozak/mcodec#4 merges
          path: mcodec

      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1

      - uses: VirtusLab/scala-cli-setup@v1

      # The pinned mcodec commit's project.scala still points at made:0.1.3.
      - name: Repoint mcodec onto made from Maven Central
        run: sed -i -E 's#(io\.github\.halotukozak::made:)[^[:space:]]+#\1'"$MADE_VERSION"'#' mcodec/project.scala

      - name: Publish mcodec locally
        run: scala-cli --power publish local mcodec --project-version "$MCODEC_VERSION"

      - name: Check formatting
        run: scala-cli --power fmt --check mrpc

      - name: Run tests
        # GoldenFixtureSuite reads fixtures/*.json by a path relative to the working directory, which
        # must therefore be mrpc/ itself (not the outer checkout root the other steps run from).
        working-directory: mrpc
        run: scala-cli --power test .
